name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @latitudelabs/design-system lint
      - run: pnpm --filter @latitudelabs/design-system check
      - run: pnpm --filter @latitudelabs/design-system build
      - run: pnpm --filter @latitudelabs/create test
      - run: pnpm --filter docs build
