name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    # Off until the repo variable RELEASE_ENABLED is set to "true" (Settings → Secrets and variables → Actions →
    # Variables). Without this guard the first push would publish v0.0.1 of both packages.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@latitudelabs'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @latitudelabs/design-system lint
      - run: pnpm --filter @latitudelabs/design-system check
      - run: pnpm --filter @latitudelabs/design-system build
      - run: pnpm --filter @latitudelabs/create test

      # Opens a "Version packages" PR when there are changesets; publishes when that PR is merged.
      - uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
